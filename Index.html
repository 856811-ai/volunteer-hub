<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VolunteerLink - Live Brampton Production System</title>
    <style>
        :root {
            --dark: #111111;
            --light: #fdfdfd;
            --border: #222222;
            --primary: #2563eb;
            --success: #16a34a;
            --warning: #ca8a04;
            --gray-bg: #f3f4f6;
            --text-muted: #555555;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            padding-bottom: 60px;
        }

        nav {
            background-color: var(--dark);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--primary);
        }

        .brand { font-size: 14px; font-weight: bold; }
        .status-badge { background-color: var(--success); padding: 4px 8px; font-size: 11px; font-weight: bold; }

        .app-grid {
            display: grid;
            grid-template-columns: 340px 1fr;
            min-height: calc(100vh - 52px);
        }

        .sidebar {
            border-right: 3px solid var(--border);
            padding: 24px;
            background-color: var(--light);
        }

        .panel-title {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: bold;
            background: var(--dark);
            color: white;
            padding: 4px 8px;
            margin-bottom: 16px;
            display: inline-block;
        }

        .profile-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
        }

        .form-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 11px; font-weight: bold; text-transform: uppercase; }

        input, select {
            border: 2px solid var(--border);
            padding: 8px;
            font-size: 13px;
            outline: none;
            background: transparent;
        }

        .btn-action {
            background-color: var(--dark);
            color: white;
            border: none;
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 11px;
        }

        .btn-action:hover { background-color: var(--primary); }

        .hours-dashboard {
            border: 2px solid var(--border);
            padding: 16px;
            background-color: var(--gray-bg);
        }

        .stat-display { font-size: 40px; font-weight: 900; line-height: 1; margin: 8px 0; }
        .progress-bar-container { border: 2px solid var(--border); height: 16px; background: white; margin-top: 10px; }
        .progress-fill { height: 100%; background-color: var(--success); width: 0%; transition: width 0.3s ease; }

        .main-content { padding: 24px; display: flex; flex-direction: column; gap: 20px; }
        .tab-navigation { display: flex; border-bottom: 3px solid var(--border); }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 12px 24px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            border-top: 3px solid transparent;
            margin-bottom: -3px;
        }

        .tab-btn.active {
            border: 3px solid var(--border);
            border-bottom: 3px solid var(--light);
            background: var(--light);
            border-top: 3px solid var(--primary);
        }

        .filter-strip {
            display: flex;
            gap: 16px;
            align-items: flex-end;
            padding: 16px;
            background: var(--gray-bg);
            border: 2px solid var(--border);
        }

        .filter-item { display: flex; flex-direction: column; gap: 4px; flex: 1; }

        .google-maps-iframe-container {
            border: 3px solid var(--border);
            width: 100%;
            height: 300px;
            background-color: #e5e7eb;
        }

        .google-maps-iframe-container iframe { width: 100%; height: 100%; border: 0; }

        .view-panel { display: none; }
        .view-panel.active-panel { display: block; }

        .opportunities-shelf {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .opportunity-card {
            border: 2px solid var(--border);
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-header {
            padding: 12px;
            border-bottom: 1px dashed var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 4px;
        }

        .tag-group { display: flex; gap: 4px; flex-wrap: wrap; }

        .interest-tag {
            font-size: 9px;
            font-weight: bold;
            text-transform: uppercase;
            border: 1px solid var(--border);
            padding: 2px 6px;
        }

        .diff-tag { background: #eee; border-color: #ccc; }

        .hours-badge {
            font-size: 11px;
            font-weight: bold;
            background: var(--dark);
            color: white;
            padding: 2px 6px;
            white-space: nowrap;
        }

        .card-body { padding: 12px; flex-grow: 1; }
        .card-body h3 { font-size: 14px; margin-bottom: 6px; }
        .card-body p { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; line-height: 1.4; }
        .meta-line { font-size: 11px; margin-bottom: 3px; }

        .card-footer { padding: 12px; background: var(--gray-bg); border-top: 2px solid var(--border); }

        .btn-trigger {
            width: 100%;
            color: white;
            border: none;
            padding: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 11px;
        }

        .btn-register-action { background-color: var(--primary); }
        .btn-complete-action { background-color: var(--warning); }

        .status-pill {
            display: inline-block;
            font-size: 9px;
            font-weight: bold;
            padding: 2px 6px;
            text-transform: uppercase;
            border: 1px solid var(--border);
        }

        .status-pill.pending { background: #ffedd5; color: #ea580c; }
        .status-pill.done { background: #dcfce7; color: #16a34a; }

        .reminder-box {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #fef08a;
            border: 2px solid var(--border);
            padding: 12px;
            max-width: 320px;
            display: none;
            box-shadow: 4px 4px 0px var(--border);
            z-index: 200;
            font-size: 12px;
        }

        .no-records {
            grid-column: 1 / -1;
            padding: 32px;
            text-align: center;
            border: 2px dashed var(--border);
            color: var(--text-muted);
            font-size: 12px;
        }
    </style>
</head>

            {id: 25, title: "Brampton Youth Mentorship Program Volunteer", category: "Community", location: "Brampton Civic Centre, 150 Central Park Dr, Brampton", hours: 4, description: "Mentor local youth through the Brampton Youth Mentorship Program, providing guidance and support to help them achieve their goals." },
            {id: 26, title: "Brampton Public Library Storytime Assistant", category: "Education", location: "Brampton Library - Mount Pleasant Village Branch, 100 Commuter Dr, Brampton", hours: 3, description: "Assist with children's storytime sessions at the Brampton Public Library, helping to engage young readers and foster a love of books." },
            {id: 27, title: "Brampton Community Recycling Program Volunteer", category: "Environment", location: "Brampton Recycling Centre, 1290 Williams Pkwy, Brampton", hours: 4, description: "Support the community recycling program by helping to sort and manage recyclable materials at the Brampton Recycling Centre." },
            {id: 28, title: "Brampton Senior Grocery Assistance Volunteer", category: "Grocery", location: "Multiple locations across Brampton", hours: 4, description: "Assist senior citizens with grocery shopping and delivery through local assistance programs in Brampton." },
            {id: 29, title: "Brampton Public Library Language Support Volunteer", category: "Education", location: "Brampton Library - Springdale Branch, 10705 Bramalea Rd, Brampton", hours: 3, description: "Provide language support and assistance to library patrons who are non-native English speakers." },
            {id: 30, title: "Brampton Community Festival Volunteer", category: "Community", location: "Various locations across Brampton", hours: 5, description: "Help organize and support community festivals and events throughout the city of Brampton." },
            {id: 31, title: "Brampton Public Library Homework Help Volunteer", category: "Education", location: "Brampton Library - South Fletchers Branch, 65 Queen St S, Brampton", hours: 3, description: "Assist students with homework and study support at the Brampton Public Library." }

        const userRegistrations = [];

        window.onload = function() {
            renderAvailableOpportunities();
            renderRegistrations();
            calculateMetrics();
        };

        function switchTab(tabTarget, tabButton) {
            document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
            document.querySelectorAll(".view-panel").forEach(panel => panel.classList.remove("active-panel"));
            tabButton.classList.add("active");
            
            if (tabTarget === 'available') {
                document.getElementById("panelAvailable").classList.add("active-panel");
                renderAvailableOpportunities();
            } else {
                document.getElementById("panelRegistrations").classList.add("active-panel");
                renderRegistrations();
            }
        }

        // GLOBAL FILTER LOGIC
        function runGlobalFilter() {
            appState.filters.category = document.getElementById("catFilter").value;
            appState.filters.difficulty = document.getElementById("diffFilter").value;
            appState.filters.commitment = document.getElementById("timeFilter").value;
            renderAvailableOpportunities();
        }

        function updateMapLocation(addressString) {
            const mapIframe = document.getElementById("liveGMap");
            mapIframe.src = `https://maps.google.com/maps?q=${encodeURIComponent(addressString)}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
        }

        function renderAvailableOpportunities() {
            const container = document.getElementById("availableContainer");
            container.innerHTML = "";

            let filtered = realBramptonDatabase.filter(op => {
                const isNotRegistered = !userRegistrations.some(reg => reg.id === op.id);
                const matchCat = appState.filters.category === "all" || op.category === appState.filters.category;
                const matchDiff = appState.filters.difficulty === "all" || op.difficulty === appState.filters.difficulty;
                const matchTime = appState.filters.commitment === "all" || op.commitment === appState.filters.commitment;
                
                return isNotRegistered && matchCat && matchDiff && matchTime;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="no-records">No opportunities match these specific criteria. Try broadening your filters.</div>`;
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement("div");
                card.className = "opportunity-card";
                card.innerHTML = `
                    <div class="card-header">
                        <div class="tag-group">
                            <span class="interest-tag">${item.category}</span>
                            <span class="interest-tag diff-tag">${item.difficulty}</span>
                        </div>
                        <span class="hours-badge">${item.hours} Hrs</span>
                    </div>
                    <div class="card-body" style="cursor: pointer;" onclick="updateMapLocation('${item.location}')">
                        <h3>${item.title}</h3>
                        <p style="font-size:10px; font-weight:bold; margin-bottom:4px;">⏱️ ${item.commitment}</p>
                        <p>${item.description}</p>
                        <div class="meta-line" style="color: var(--primary); font-size:10px;">📍 Click to View Map:</div>
                        <div class="meta-line" style="font-size:10px; font-style:italic;">${item.location}</div>
                    </div>
                    <div class="card-footer">
                        <button class="btn-trigger btn-register-action" onclick="registerOpportunity(${item.id})">Register For Role</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderRegistrations() {
            const container = document.getElementById("registrationsContainer");
            container.innerHTML = "";
            document.getElementById("regCount").innerText = userRegistrations.length;

            if (userRegistrations.length === 0) {
                container.innerHTML = `<div class="no-records">No tracked shifts logged yet.</div>`;
                return;
            }

            userRegistrations.forEach(item => {
                const isPending = item.status === "pending";
                const card = document.createElement("div");
                card.className = "opportunity-card";
                card.innerHTML = `
                    <div class="card-header">
                        <span class="status-pill ${item.status}">${item.status}</span>
                        <span class="hours-badge">${item.hours} Hrs</span>
                    </div>
                    <div class="card-body">
                        <h3>${item.title}</h3>
                        <div class="meta-line"><strong>📍 Venue:</strong> ${item.location}</div>
                    </div>
                    <div class="card-footer">
                        ${isPending ? `<button class="btn-trigger btn-complete-action" onclick="claimJobHours(${item.id})">Mark Completed</button>` 
                        : `<button class="btn-trigger" style="background:#d1d5db; color:#4b5563; cursor:not-allowed;" disabled>✓ Hours Audited</button>`}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function registerOpportunity(id) {
            const matchedItem = realBramptonDatabase.find(op => op.id === id);
            if (matchedItem) {
                userRegistrations.push({ ...matchedItem, status: "pending" });
                triggerTelemetryAlert(`Registered: ${matchedItem.title}`);
                renderAvailableOpportunities();
                renderRegistrations();
            }
        }

        function claimJobHours(id) {
            const record = userRegistrations.find(reg => reg.id === id);
            if (record && record.status === "pending") {
                record.status = "done";
                appState.completedHours += record.hours;
                triggerTelemetryAlert(`Transaction confirmed! +${record.hours} hours added.`);
                calculateMetrics();
                renderRegistrations();
            }
        }

        function calculateMetrics() {
            document.getElementById("currentHours").innerText = appState.completedHours;
            document.getElementById("goalHours").innerText = appState.targetHours;
            document.getElementById("displayStudent").innerText = `${appState.studentName}'s Balance`;
            const computedPercentage = Math.min(Math.round((appState.completedHours / appState.targetHours) * 100), 100);
            document.getElementById("percentText").innerText = `${computedPercentage}% Verified & Credited`;
            document.getElementById("progressFill").style.width = `${computedPercentage}%`;
        }

        function updateProfile() {
            const enteredName = document.getElementById("studentName").value.trim();
            const enteredHours = parseInt(document.getElementById("targetHours").value, 10);
            if (enteredName) appState.studentName = enteredName;
            if (enteredHours > 0) appState.targetHours = enteredHours;
            calculateMetrics();
            triggerTelemetryAlert("Account metadata updated.");
        }

        function triggerTelemetryAlert(messageText) {
            const alertNode = document.getElementById("reminderAlert");
            document.getElementById("reminderMessage").innerText = messageText;
            alertNode.style.display = "block";
            setTimeout(() => alertNode.style.display = "none", 4500);
        }
    </script>
</body>
